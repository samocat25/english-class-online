const XLSX = window.XLSX;
const BookOpen = (size = {}) => React.createElement("span", {style: {display:"inline-block", width: (size||14), textAlign:"center", fontSize:(size||14), lineHeight:1}}, "▣");
const ClipboardList = (size = {}) => React.createElement("span", {style: {display:"inline-block", width: (size||14), textAlign:"center", fontSize:(size||14), lineHeight:1}}, "☷");
const Award = (size = {}) => React.createElement("span", {style: {display:"inline-block", width: (size||14), textAlign:"center", fontSize:(size||14), lineHeight:1}}, "★");
const LogOut = (size = {}) => React.createElement("span", {style: {display:"inline-block", width: (size||14), textAlign:"center", fontSize:(size||14), lineHeight:1}}, "↪");
const Plus = (size = {}) => React.createElement("span", {style: {display:"inline-block", width: (size||14), textAlign:"center", fontSize:(size||14), lineHeight:1}}, "+");
const Trash2 = (size = {}) => React.createElement("span", {style: {display:"inline-block", width: (size||14), textAlign:"center", fontSize:(size||14), lineHeight:1}}, "×");
const Send = (size = {}) => React.createElement("span", {style: {display:"inline-block", width: (size||14), textAlign:"center", fontSize:(size||14), lineHeight:1}}, "➤");
const CheckCircle2 = (size = {}) => React.createElement("span", {style: {display:"inline-block", width: (size||14), textAlign:"center", fontSize:(size||14), lineHeight:1}}, "✓");
const Download = (size = {}) => React.createElement("span", {style: {display:"inline-block", width: (size||14), textAlign:"center", fontSize:(size||14), lineHeight:1}}, "↓");
const RefreshCw = (size = {}) => React.createElement("span", {style: {display:"inline-block", width: (size||14), textAlign:"center", fontSize:(size||14), lineHeight:1}}, "↻");
const LinkIcon = (size = {}) => React.createElement("span", {style: {display:"inline-block", width: (size||14), textAlign:"center", fontSize:(size||14), lineHeight:1}}, "↗");
const Clock = (size = {}) => React.createElement("span", {style: {display:"inline-block", width: (size||14), textAlign:"center", fontSize:(size||14), lineHeight:1}}, "◷");

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

const fmtDate = (iso) => {
  if (!iso) return "-";
  try {
    return new Date(iso).toLocaleString("id-ID", {
      day: "2-digit",
      month: "short",
      year: "numeric",
      hour: "2-digit",
      minute: "2-digit",
    });
  } catch {
    return iso;
  }
};

async function loadList(key) {
  try {
    const res = await window.storage.get(key, true);
    if (!res) return [];
    const val = JSON.parse(res.value);
    return Array.isArray(val) ? val : [];
  } catch {
    return [];
  }
}

async function saveList(key, list) {
  try {
    await window.storage.set(key, JSON.stringify(list), true);
  } catch (e) {
    console.error("storage error", e);
  }
}

function App() {
  const [role, setRole] = useState(null); // 'teacher' | 'student'
  const [name, setName] = useState("");

  if (!role) return <RoleGate onEnter={(r, n) => { setRole(r); setName(n); }} />;

  return role === "teacher" ? (
    <TeacherApp name={name} onLogout={() => setRole(null)} />
  ) : (
    <StudentApp name={name} onLogout={() => setRole(null)} />
  );
}

/* ------------------------------ Teacher app ----------------------------- */

function TeacherApp({ name, onLogout }) {
  const [tab, setTab] = useState("materi");
  const [materials, setMaterials] = useState([]);
  const [assignments, setAssignments] = useState([]);
  const [submissions, setSubmissions] = useState([]);
  const [loading, setLoading] = useState(true);

  const refreshAll = useCallback(async () => {
    setLoading(true);
    const [m, a, s] = await Promise.all([
      loadList("materials"),
      loadList("assignments"),
      loadList("submissions"),
    ]);
    setMaterials(m);
    setAssignments(a);
    setSubmissions(s);
    setLoading(false);
  }, []);

  useEffect(() => { refreshAll(); }, [refreshAll]);

  const tabs = [
    { key: "materi", label: "Materi", icon: <BookOpen size={16} />, color: "var(--sage)" },
    { key: "tugas", label: "Tugas", icon: <ClipboardList size={16} />, color: "var(--mustard)" },
    { key: "nilai", label: "Nilai", icon: <Award size={16} />, color: "var(--coral)" },
  ];

  return (
    <div className="elc-root">
      <GlobalStyle />
      <div style={{ display: "flex", minHeight: "100vh", background: "var(--ink)" }}>
        <Sidebar tabs={tabs} active={tab} setActive={setTab} title="Panel Guru" name={name} onLogout={onLogout} />
        <div style={{ flex: 1, padding: "24px 28px 40px 0" }}>
          <div className="elc-page">
            {loading ? (
              <div style={{ color: "var(--ink-soft)" }}>Memuat data…</div>
            ) : tab === "materi" ? (
              <MateriTeacher materials={materials} setMaterials={setMaterials} />
            ) : tab === "tugas" ? (
              <TugasTeacher
                assignments={assignments}
                setAssignments={setAssignments}
                submissions={submissions}
                setSubmissions={setSubmissions}
              />
            ) : (
              <NilaiTeacher
                assignments={assignments}
                submissions={submissions}
                setSubmissions={setSubmissions}
                onRefresh={refreshAll}
              />
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

function MateriTeacher({ materials, setMaterials }) {
  const [title, setTitle] = useState("");
  const [desc, setDesc] = useState("");
  const [link, setLink] = useState("");
  const [saving, setSaving] = useState(false);

  const add = async () => {
    if (!title.trim()) return;
    setSaving(true);
    const item = { id: uid(), title: title.trim(), desc: desc.trim(), link: link.trim(), date: new Date().toISOString() };
    const updated = [item, ...materials];
    await saveList("materials", updated);
    setMaterials(updated);
    setTitle(""); setDesc(""); setLink("");
    setSaving(false);
  };

  const remove = async (id) => {
    const updated = materials.filter((m) => m.id !== id);
    await saveList("materials", updated);
    setMaterials(updated);
  };

  return (
    <div>
      <h3 style={{ fontSize: 20, marginBottom: 4 }}>Materi Bahasa Inggris</h3>
      <p style={{ color: "var(--ink-soft)", fontSize: 13.5, marginBottom: 18 }}>
        Bagikan bahan bacaan, video, atau catatan untuk siswa.
      </p>

      <div className="elc-card" style={{ marginBottom: 22 }}>
        <input className="elc-input" placeholder="Judul materi (contoh: Simple Past Tense)" value={title} onChange={(e) => setTitle(e.target.value)} style={{ marginBottom: 10 }} />
        <textarea className="elc-textarea" placeholder="Penjelasan singkat / ringkasan materi" value={desc} onChange={(e) => setDesc(e.target.value)} style={{ marginBottom: 10 }} />
        <input className="elc-input" placeholder="Tautan (opsional) — video, PDF, dsb." value={link} onChange={(e) => setLink(e.target.value)} style={{ marginBottom: 12 }} />
        <button className="elc-btn elc-btn-sage" onClick={add} disabled={saving || !title.trim()}>
          <Plus size={15} /> Tambah materi
        </button>
      </div>

      {materials.length === 0 ? (
        <EmptyNote text="Belum ada materi. Tambahkan materi pertama di atas." />
      ) : (
        <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          {materials.map((m) => (
            <div key={m.id} className="elc-card" style={{ display: "flex", justifyContent: "space-between", gap: 12 }}>
              <div>
                <div style={{ fontWeight: 600 }}>{m.title}</div>
                {m.desc && <div style={{ fontSize: 13.5, color: "var(--ink-soft)", marginTop: 3 }}>{m.desc}</div>}
                {m.link && (
                  <a href={m.link} target="_blank" rel="noreferrer" style={{ fontSize: 13, color: "var(--sage-deep)", display: "inline-flex", alignItems: "center", gap: 4, marginTop: 6 }}>
                    <LinkIcon size={12} /> Buka tautan
                  </a>
                )}
                <div style={{ fontSize: 12, color: "#9aa5ad", marginTop: 6 }}>{fmtDate(m.date)}</div>
              </div>
              <button className="elc-btn elc-btn-danger" onClick={() => remove(m.id)} title="Hapus"><Trash2 size={16} /></button>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function TugasTeacher({ assignments, setAssignments, submissions, setSubmissions }) {
  const [title, setTitle] = useState("");
  const [desc, setDesc] = useState("");
  const [due, setDue] = useState("");
  const [openId, setOpenId] = useState(null);

  const add = async () => {
    if (!title.trim()) return;
    const item = { id: uid(), title: title.trim(), desc: desc.trim(), due, createdAt: new Date().toISOString() };
    const updated = [item, ...assignments];
    await saveList("assignments", updated);
    setAssignments(updated);
    setTitle(""); setDesc(""); setDue("");
  };

  const remove = async (id) => {
    const updated = assignments.filter((a) => a.id !== id);
    await saveList("assignments", updated);
    setAssignments(updated);
    const subUpdated = submissions.filter((s) => s.assignmentId !== id);
    await saveList("submissions", subUpdated);
    setSubmissions(subUpdated);
  };

  const gradeOne = async (subId, score, feedback) => {
    const updated = submissions.map((s) =>
      s.id === subId ? { ...s, score: score === "" ? null : Number(score), feedback, gradedAt: new Date().toISOString() } : s
    );
    await saveList("submissions", updated);
    setSubmissions(updated);
  };

  return (
    <div>
      <h3 style={{ fontSize: 20, marginBottom: 4 }}>Tugas</h3>
      <p style={{ color: "var(--ink-soft)", fontSize: 13.5, marginBottom: 18 }}>
        Buat tugas baru dan periksa jawaban siswa.
      </p>

      <div className="elc-card" style={{ marginBottom: 22 }}>
        <input className="elc-input" placeholder="Judul tugas" value={title} onChange={(e) => setTitle(e.target.value)} style={{ marginBottom: 10 }} />
        <textarea className="elc-textarea" placeholder="Instruksi tugas untuk siswa" value={desc} onChange={(e) => setDesc(e.target.value)} style={{ marginBottom: 10 }} />
        <div style={{ display: "flex", gap: 10, alignItems: "center", marginBottom: 12 }}>
          <label style={{ fontSize: 13, color: "var(--ink-soft)" }}>Tenggat:</label>
          <input type="date" className="elc-input" value={due} onChange={(e) => setDue(e.target.value)} style={{ width: 170 }} />
        </div>
        <button className="elc-btn elc-btn-mustard" onClick={add} disabled={!title.trim()}>
          <Plus size={15} /> Buat tugas
        </button>
      </div>

      {assignments.length === 0 ? (
        <EmptyNote text="Belum ada tugas. Buat tugas pertama di atas." />
      ) : (
        <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          {assignments.map((a) => {
            const subs = submissions.filter((s) => s.assignmentId === a.id);
            const isOpen = openId === a.id;
            return (
              <div key={a.id} className="elc-card">
                <div style={{ display: "flex", justifyContent: "space-between" }}>
                  <div>
                    <div style={{ fontWeight: 600 }}>{a.title}</div>
                    <div style={{ fontSize: 13.5, color: "var(--ink-soft)", marginTop: 3 }}>{a.desc}</div>
                    <div style={{ fontSize: 12, color: "#9aa5ad", marginTop: 6, display: "flex", gap: 12 }}>
                      {a.due && <span><Clock size={12} style={{ verticalAlign: -1 }} /> Tenggat {a.due}</span>}
                      <span>{subs.length} pengumpulan</span>
                    </div>
                  </div>
                  <div style={{ display: "flex", gap: 6, alignItems: "flex-start" }}>
                    <button className="elc-btn elc-btn-ghost" onClick={() => setOpenId(isOpen ? null : a.id)}>
                      {isOpen ? "Tutup" : "Lihat jawaban"}
                    </button>
                    <button className="elc-btn elc-btn-danger" onClick={() => remove(a.id)} title="Hapus"><Trash2 size={16} /></button>
                  </div>
                </div>

                {isOpen && (
                  <div style={{ marginTop: 14, borderTop: "1px solid var(--rule)", paddingTop: 14, display: "flex", flexDirection: "column", gap: 12 }}>
                    {subs.length === 0 ? (
                      <div style={{ fontSize: 13.5, color: "var(--ink-soft)" }}>Belum ada siswa yang mengumpulkan.</div>
                    ) : (
                      subs.map((s) => (
                        <SubmissionRow key={s.id} sub={s} onGrade={gradeOne} />
                      ))
                    )}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function SubmissionRow({ sub, onGrade }) {
  const [score, setScore] = useState(sub.score ?? "");
  const [feedback, setFeedback] = useState(sub.feedback ?? "");

  return (
    <div style={{ background: "var(--paper)", borderRadius: 6, padding: 12 }}>
      <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 6 }}>
        <div style={{ fontWeight: 600, fontSize: 14 }}>{sub.studentName}</div>
        <div style={{ fontSize: 12, color: "#8b96a0" }}>{fmtDate(sub.submittedAt)}</div>
      </div>
      <div style={{ fontSize: 13.5, whiteSpace: "pre-wrap", marginBottom: 10 }}>{sub.content}</div>
      <div style={{ display: "flex", gap: 8, alignItems: "flex-start" }}>
        <input
          className="elc-input"
          type="number" min="0" max="100"
          placeholder="Nilai"
          value={score}
          onChange={(e) => setScore(e.target.value)}
          style={{ width: 80 }}
        />
        <input
          className="elc-input"
          placeholder="Catatan untuk siswa (opsional)"
          value={feedback}
          onChange={(e) => setFeedback(e.target.value)}
        />
        <button className="elc-btn elc-btn-primary" onClick={() => onGrade(sub.id, score, feedback)}>
          Simpan
        </button>
      </div>
      {sub.gradedAt && (
        <div style={{ fontSize: 12, color: "var(--sage-deep)", marginTop: 6, display: "flex", alignItems: "center", gap: 4 }}>
          <CheckCircle2 size={13} /> Sudah dinilai
        </div>
      )}
    </div>
  );
}

function NilaiTeacher({ assignments, submissions, onRefresh }) {
  const [filterAssignment, setFilterAssignment] = useState("all");

  const rows = submissions
    .filter((s) => filterAssignment === "all" || s.assignmentId === filterAssignment)
    .map((s) => {
      const a = assignments.find((x) => x.id === s.assignmentId);
      return { ...s, assignmentTitle: a ? a.title : "(tugas dihapus)" };
    })
    .sort((a, b) => (a.assignmentTitle > b.assignmentTitle ? 1 : -1));

  const exportExcel = () => {
    const data = rows.map((r) => ({
      "Nama Siswa": r.studentName,
      "Tugas": r.assignmentTitle,
      "Tanggal Kumpul": fmtDate(r.submittedAt),
      "Nilai": r.score ?? "",
      "Catatan": r.feedback ?? "",
      "Status": r.score != null ? "Sudah Dinilai" : "Belum Dinilai",
    }));
    const ws = XLSX.utils.json_to_sheet(data);
    ws["!cols"] = [{ wch: 20 }, { wch: 26 }, { wch: 18 }, { wch: 8 }, { wch: 30 }, { wch: 14 }];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Nilai");
    const label = filterAssignment === "all" ? "Semua_Tugas" : (assignments.find(a => a.id === filterAssignment)?.title || "Tugas").replace(/\s+/g, "_");
    XLSX.writeFile(wb, `Nilai_English_${label}_${new Date().toISOString().slice(0, 10)}.xlsx`);
  };

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 18 }}>
        <div>
          <h3 style={{ fontSize: 20, marginBottom: 4 }}>Rekap Nilai</h3>
          <p style={{ color: "var(--ink-soft)", fontSize: 13.5 }}>Ekspor nilai langsung ke Excel.</p>
        </div>
        <div style={{ display: "flex", gap: 8 }}>
          <button className="elc-btn elc-btn-ghost" onClick={onRefresh}><RefreshCw size={14} /> Muat ulang</button>
          <button className="elc-btn elc-btn-primary" onClick={exportExcel} disabled={rows.length === 0}>
            <Download size={15} /> Ekspor ke Excel
          </button>
        </div>
      </div>

      <select className="elc-input" style={{ width: 260, marginBottom: 16 }} value={filterAssignment} onChange={(e) => setFilterAssignment(e.target.value)}>
        <option value="all">Semua tugas</option>
        {assignments.map((a) => <option key={a.id} value={a.id}>{a.title}</option>)}
      </select>

      {rows.length === 0 ? (
        <EmptyNote text="Belum ada pengumpulan tugas untuk ditampilkan." />
      ) : (
        <div className="elc-card" style={{ padding: 0, overflow: "hidden" }}>
          <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13.5 }}>
            <thead>
              <tr style={{ background: "var(--paper)", textAlign: "left" }}>
                <Th>Siswa</Th><Th>Tugas</Th><Th>Kumpul</Th><Th>Nilai</Th><Th>Status</Th>
              </tr>
            </thead>
            <tbody>
              {rows.map((r) => (
                <tr key={r.id} style={{ borderTop: "1px solid var(--rule)" }}>
                  <Td>{r.studentName}</Td>
                  <Td>{r.assignmentTitle}</Td>
                  <Td>{fmtDate(r.submittedAt)}</Td>
                  <Td>{r.score ?? "—"}</Td>
                  <Td>
                    <span style={{ color: r.score != null ? "var(--sage-deep)" : "var(--coral)", fontWeight: 600 }}>
                      {r.score != null ? "Dinilai" : "Belum"}
                    </span>
                  </Td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

const Th = ({ children }) => <th style={{ padding: "10px 14px", fontWeight: 600 }}>{children}</th>;
const Td = ({ children }) => <td style={{ padding: "10px 14px" }}>{children}</td>;

/* ------------------------------ Student app ----------------------------- */

function StudentApp({ name, onLogout }) {
  const [tab, setTab] = useState("materi");
  const [materials, setMaterials] = useState([]);
  const [assignments, setAssignments] = useState([]);
  const [submissions, setSubmissions] = useState([]);
  const [loading, setLoading] = useState(true);

  const refreshAll = useCallback(async () => {
    setLoading(true);
    const [m, a, s] = await Promise.all([
      loadList("materials"),
      loadList("assignments"),
      loadList("submissions"),
    ]);
    setMaterials(m);
    setAssignments(a);
    setSubmissions(s);
    setLoading(false);
  }, []);

  useEffect(() => { refreshAll(); }, [refreshAll]);

  const tabs = [
    { key: "materi", label: "Materi", icon: <BookOpen size={16} />, color: "var(--sage)" },
    { key: "tugas", label: "Tugas", icon: <ClipboardList size={16} />, color: "var(--mustard)" },
  ];

  const mySubmissions = submissions.filter((s) => s.studentName === name);

  return (
    <div className="elc-root">
      <GlobalStyle />
      <div style={{ display: "flex", minHeight: "100vh", background: "var(--ink)" }}>
        <Sidebar tabs={tabs} active={tab} setActive={setTab} title="Panel Siswa" name={name} onLogout={onLogout} />
        <div style={{ flex: 1, padding: "24px 28px 40px 0" }}>
          <div className="elc-page">
            {loading ? (
              <div style={{ color: "var(--ink-soft)" }}>Memuat data…</div>
            ) : tab === "materi" ? (
              <MateriStudent materials={materials} />
            ) : (
              <TugasStudent
                assignments={assignments}
                mySubmissions={mySubmissions}
                studentName={name}
                submissions={submissions}
                setSubmissions={setSubmissions}
                onRefresh={refreshAll}
              />
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

function MateriStudent({ materials }) {
  return (
    <div>
      <h3 style={{ fontSize: 20, marginBottom: 4 }}>Materi Bahasa Inggris</h3>
      <p style={{ color: "var(--ink-soft)", fontSize: 13.5, marginBottom: 18 }}>Bahan belajar dari gurumu.</p>
      {materials.length === 0 ? (
        <EmptyNote text="Belum ada materi yang dibagikan guru." />
      ) : (
        <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          {materials.map((m) => (
            <div key={m.id} className="elc-card">
              <div style={{ fontWeight: 600 }}>{m.title}</div>
              {m.desc && <div style={{ fontSize: 13.5, color: "var(--ink-soft)", marginTop: 3 }}>{m.desc}</div>}
              {m.link && (
                <a href={m.link} target="_blank" rel="noreferrer" style={{ fontSize: 13, color: "var(--sage-deep)", display: "inline-flex", alignItems: "center", gap: 4, marginTop: 6 }}>
                  <LinkIcon size={12} /> Buka tautan
                </a>
              )}
              <div style={{ fontSize: 12, color: "#9aa5ad", marginTop: 6 }}>{fmtDate(m.date)}</div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function TugasStudent({ assignments, mySubmissions, studentName, submissions, setSubmissions, onRefresh }) {
  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 4 }}>
        <h3 style={{ fontSize: 20 }}>Tugas</h3>
        <button className="elc-btn elc-btn-ghost" onClick={onRefresh}><RefreshCw size={14} /> Muat ulang</button>
      </div>
      <p style={{ color: "var(--ink-soft)", fontSize: 13.5, marginBottom: 18 }}>Kerjakan dan kumpulkan tugas di bawah ini.</p>

      {assignments.length === 0 ? (
        <EmptyNote text="Belum ada tugas dari guru." />
      ) : (
        <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          {assignments.map((a) => {
            const mySub = mySubmissions.find((s) => s.assignmentId === a.id);
            return (
              <AssignmentCard
                key={a.id}
                assignment={a}
                mySub={mySub}
                studentName={studentName}
                submissions={submissions}
                setSubmissions={setSubmissions}
              />
            );
          })}
        </div>
      )}
    </div>
  );
}

function AssignmentCard({ assignment, mySub, studentName, submissions, setSubmissions }) {
  const [answer, setAnswer] = useState("");
  const [sending, setSending] = useState(false);

  const submit = async () => {
    if (!answer.trim()) return;
    setSending(true);
    const item = {
      id: uid(),
      assignmentId: assignment.id,
      studentName,
      content: answer.trim(),
      submittedAt: new Date().toISOString(),
      score: null,
      feedback: "",
    };
    const updated = [...submissions, item];
    await saveList("submissions", updated);
    setSubmissions(updated);
    setAnswer("");
    setSending(false);
  };

  return (
    <div className="elc-card">
      <div style={{ fontWeight: 600 }}>{assignment.title}</div>
      <div style={{ fontSize: 13.5, color: "var(--ink-soft)", marginTop: 3 }}>{assignment.desc}</div>
      {assignment.due && (
        <div style={{ fontSize: 12, color: "#9aa5ad", marginTop: 6 }}>
          <Clock size={12} style={{ verticalAlign: -1 }} /> Tenggat {assignment.due}
        </div>
      )}

      <div style={{ marginTop: 12, borderTop: "1px solid var(--rule)", paddingTop: 12 }}>
        {mySub ? (
          <div>
            <div style={{ fontSize: 13, color: "var(--sage-deep)", display: "flex", alignItems: "center", gap: 5, marginBottom: 6 }}>
              <CheckCircle2 size={14} /> Sudah dikumpulkan · {fmtDate(mySub.submittedAt)}
            </div>
            <div style={{ background: "var(--paper)", borderRadius: 6, padding: 10, fontSize: 13.5, whiteSpace: "pre-wrap", marginBottom: 8 }}>
              {mySub.content}
            </div>
            {mySub.score != null ? (
              <div style={{ fontSize: 13.5 }}>
                <strong>Nilai: {mySub.score}</strong>
                {mySub.feedback && <div style={{ color: "var(--ink-soft)", marginTop: 4 }}>Catatan guru: {mySub.feedback}</div>}
              </div>
            ) : (
              <div style={{ fontSize: 13, color: "var(--mustard)", fontWeight: 600 }}>Menunggu penilaian guru</div>
            )}
          </div>
        ) : (
          <div>
            <textarea
              className="elc-textarea"
              placeholder="Tulis jawabanmu di sini…"
              value={answer}
              onChange={(e) => setAnswer(e.target.value)}
              style={{ marginBottom: 10 }}
            />
            <button className="elc-btn elc-btn-sage" onClick={submit} disabled={sending || !answer.trim()}>
              <Send size={14} /> Kumpulkan tugas
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

/* -------------------------------- Bits ---------------------------------- */

function EmptyNote({ text }) {
  return (
    <div style={{ fontSize: 13.5, color: "var(--ink-soft)", background: "var(--paper)", borderRadius: 6, padding: 14, border: "1px dashed var(--rule)" }}>
      {text}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);</script></body></html>
