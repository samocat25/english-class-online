<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Class Online</title>
<style>
:root{
  --navy:#1e3350;--navy2:#314a68;--sage:#6e8f71;--sage2:#e7efe7;
  --gold:#d9a441;--coral:#c1554d;--paper:#fffdf8;--bg:#eef1ed;
  --line:#dcd6c6;--muted:#65758a;--white:#fff;
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--navy)}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.app{min-height:100vh}
.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,var(--navy),#526b61);padding:20px}
.login-card{width:min(430px,100%);background:var(--paper);padding:34px;border-radius:18px;box-shadow:0 20px 60px #0005}
.badge{display:inline-block;background:var(--gold);padding:6px 10px;border-radius:6px;font-size:11px;font-weight:800;letter-spacing:.5px}
h1,h2,h3{margin:0}
.login h1{font-size:30px;margin:14px 0 8px}
.muted{color:var(--muted);font-size:14px;line-height:1.55}
.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:22px 0 14px}
.btn{border:0;border-radius:9px;padding:11px 15px;font-weight:700}
.btn.primary{background:var(--navy);color:white}.btn.sage{background:var(--sage);color:white}
.btn.gold{background:var(--gold);color:#30250b}.btn.ghost{background:white;color:var(--navy);border:1px solid var(--line)}
.btn.danger{background:#fff0ee;color:var(--coral);border:1px solid #f0c8c3}
.btn.full{width:100%}
.field{margin:10px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
.input,.textarea,.select{width:100%;border:1px solid var(--line);border-radius:9px;padding:11px;background:white;color:var(--navy);outline:none}
.textarea{min-height:95px;resize:vertical}
.input:focus,.textarea:focus,.select:focus{border-color:var(--sage);box-shadow:0 0 0 3px #6e8f7122}
.top{min-height:100vh;display:flex}
.sidebar{width:230px;background:var(--navy);color:white;padding:25px 14px;flex-shrink:0}
.brand{padding:0 10px 25px}.brand small{opacity:.7}.brand h2{margin-top:4px;font-size:20px}
.user{font-size:13px;opacity:.75;margin-top:5px}
.nav{display:grid;gap:8px}.nav button{border:0;background:transparent;color:white;text-align:left;padding:12px;border-radius:9px;font-weight:700;opacity:.75}
.nav button.active,.nav button:hover{background:#ffffff18;opacity:1}
.main{flex:1;padding:24px;overflow:auto}
.page{max-width:1050px;margin:auto;background:var(--paper);min-height:calc(100vh - 48px);border:1px solid var(--line);border-radius:16px;padding:28px}
.header{display:flex;justify-content:space-between;gap:15px;align-items:flex-start;margin-bottom:20px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.card{background:white;border:1px solid var(--line);border-radius:12px;padding:17px}
.card h3{font-size:17px}.card p{white-space:pre-wrap}
.form-card{margin-bottom:20px;background:#faf9f3}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.meta{font-size:12px;color:#8a95a0;margin-top:7px}
.link{color:var(--sage);font-weight:700;text-decoration:none}
.empty{padding:20px;background:#f5f5ef;border:1px dashed var(--line);border-radius:10px;color:var(--muted)}
.tabs{display:flex;gap:8px;margin-bottom:18px}.tabs button{border:1px solid var(--line);background:white;border-radius:8px;padding:9px 13px}.tabs button.active{background:var(--navy);color:white}
.submission{background:#f3f5f1;padding:13px;border-radius:9px;margin-top:10px}
.score{font-size:20px;font-weight:800;color:var(--sage)}
.notice{background:#fff7df;border:1px solid #ead18a;padding:12px;border-radius:9px;font-size:13px;margin-bottom:16px}
@media(max-width:760px){
 .top{display:block}.sidebar{width:100%;padding:14px}.brand{padding:5px 8px 12px}.nav{grid-template-columns:repeat(3,1fr)}.nav button{padding:9px;font-size:12px}
 .main{padding:10px}.page{min-height:calc(100vh - 20px);padding:18px}.grid{grid-template-columns:1fr}.header{display:block}.header .actions{margin-top:12px}
}
</style>
</head>
<body>
<div id="root"></div>
<script>
const KEY="english_class_online_v2";
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const initial=()=>({teacher:null,materials:[],assignments:[],submissions:[]});
let db=JSON.parse(localStorage.getItem(KEY)||"null")||initial();
let session=null, roleTab="materi";

function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function dateText(v){if(!v)return "-";return new Date(v).toLocaleString("id-ID",{dateStyle:"medium",timeStyle:"short"})}
function render(){session?renderApp():renderLogin()}

function renderLogin(){
root.innerHTML=`<div class="login"><div class="login-card">
<span class="badge">ENGLISH CLASS ONLINE</span>
<h1>Ruang Belajar Bahasa Inggris</h1>
<p class="muted">Materi, tugas, pengumpulan, dan nilai dalam satu tempat.</p>
<div class="role-grid">
<button class="btn sage" onclick="showStudent()">Saya Siswa</button>
<button class="btn primary" onclick="showTeacher()">Saya Guru</button>
</div>
<div id="loginForm"></div>
</div></div>`;
}
function showStudent(){
document.getElementById("loginForm").innerHTML=`<div class="field"><label>Nama lengkap</label><input id="sname" class="input" placeholder="Contoh: Ahmad Fauzan"></div>
<button class="btn gold full" onclick="studentLogin()">Masuk sebagai Siswa →</button>`;
}
function showTeacher(){
const exists=!!db.teacher;
document.getElementById("loginForm").innerHTML=exists?`
<div class="field"><label>Email guru</label><input id="temail" class="input" type="email" placeholder="email@sekolah.com"></div>
<div class="field"><label>Password</label><input id="tpass" class="input" type="password" placeholder="Password"></div>
<div id="err" class="muted" style="color:var(--coral);margin:8px 0"></div>
<button class="btn gold full" onclick="teacherLogin()">Masuk sebagai Guru →</button>
<button class="btn ghost full" style="margin-top:8px" onclick="showRegister()">Ganti akun guru</button>`:`<div class="field"><label>Nama guru</label><input id="tname" class="input" placeholder="Nama lengkap"></div>
<div class="field"><label>Email guru</label><input id="temail" class="input" type="email" placeholder="email@sekolah.com"></div>
<div class="field"><label>Password</label><input id="tpass" class="input" type="password" placeholder="Minimal 6 karakter"></div>
<button class="btn gold full" onclick="registerTeacher()">Buat akun guru →</button>`;
}
function showRegister(){
document.getElementById("loginForm").innerHTML=`<div class="field"><label>Nama guru</label><input id="tname" class="input" placeholder="Nama lengkap"></div>
<div class="field"><label>Email guru</label><input id="temail" class="input" type="email"></div>
<div class="field"><label>Password</label><input id="tpass" class="input" type="password"></div>
<button class="btn gold full" onclick="registerTeacher()">Simpan akun guru →</button>`;
}
function studentLogin(){
const n=document.getElementById("sname").value.trim();if(!n)return alert("Masukkan nama lengkap.");
session={role:"student",name:n};roleTab="materi";render();
}
function registerTeacher(){
const name=document.getElementById("tname").value.trim(),email=document.getElementById("temail").value.trim().toLowerCase(),pass=document.getElementById("tpass").value;
if(!name||!email.includes("@")||pass.length<6)return alert("Lengkapi data. Password minimal 6 karakter.");
db.teacher={name,email,password:pass};save();session={role:"teacher",name};roleTab="materi";render();
}
function teacherLogin(){
const e=document.getElementById("temail").value.trim().toLowerCase(),p=document.getElementById("tpass").value;
if(!db.teacher||e!==db.teacher.email||p!==db.teacher.password){document.getElementById("err").textContent="Email atau password salah.";return}
session={role:"teacher",name:db.teacher.name};roleTab="materi";render();
}
function logout(){session=null;render()}

function shell(content,tabs){
root.innerHTML=`<div class="top"><aside class="sidebar"><div class="brand"><small>English Class Online</small><h2>${session.role==="teacher"?"Panel Guru":"Panel Siswa"}</h2><div class="user">${esc(session.name)}</div></div>
<div class="nav">${tabs.map(t=>`<button class="${roleTab===t[0]?"active":""}" onclick="roleTab='${t[0]}';renderApp()">${t[1]}</button>`).join("")}<button onclick="logout()">Keluar</button></div></aside>
<main class="main"><section class="page">${content}</section></main></div>`;
}

function renderApp(){session.role==="teacher"?teacherApp():studentApp()}

function teacherApp(){
let c="";
if(roleTab==="materi")c=teacherMaterials();
if(roleTab==="tugas")c=teacherAssignments();
if(roleTab==="nilai")c=teacherGrades();
shell(c,[["materi","📚 Materi"],["tugas","📝 Tugas"],["nilai","🏆 Nilai"]]);
}
function teacherMaterials(){
return `<div class="header"><div><h2>Materi Bahasa Inggris</h2><p class="muted">Bagikan bahan belajar untuk siswa.</p></div></div>
<div class="card form-card"><div class="field"><label>Judul materi</label><input id="mtitle" class="input" placeholder="Contoh: Simple Present Tense"></div>
<div class="field"><label>Penjelasan</label><textarea id="mdesc" class="textarea" placeholder="Ringkasan materi..."></textarea></div>
<div class="field"><label>Link materi (opsional)</label><input id="mlink" class="input" placeholder="https://..."></div>
<button class="btn sage" onclick="addMaterial()">+ Tambah materi</button></div>
${db.materials.length?db.materials.map(m=>`<div class="card" style="margin-bottom:10px"><div class="header" style="margin:0"><div><h3>${esc(m.title)}</h3>${m.desc?`<p class="muted">${esc(m.desc)}</p>`:""}${m.link?`<a class="link" href="${esc(m.link)}" target="_blank" rel="noopener">Buka tautan ↗</a>`:""}<div class="meta">${dateText(m.date)}</div></div><button class="btn danger" onclick="deleteMaterial('${m.id}')">Hapus</button></div></div>`).join(""):`<div class="empty">Belum ada materi.</div>`}`;
}
function addMaterial(){
const title=mtitle.value.trim(),desc=mdesc.value.trim(),link=mlink.value.trim();
if(!title)return alert("Judul materi wajib diisi.");
if(link&&!/^https?:\\/\\//i.test(link))return alert("Link harus diawali http:// atau https://");
db.materials.unshift({id:uid(),title,desc,link,date:new Date().toISOString()});save();renderApp();
}
function deleteMaterial(id){if(confirm("Hapus materi ini?")){db.materials=db.materials.filter(x=>x.id!==id);save();renderApp()}}

function teacherAssignments(){
return `<div class="header"><div><h2>Tugas</h2><p class="muted">Buat tugas dan periksa jawaban siswa.</p></div></div>
<div class="card form-card"><div class="field"><label>Judul tugas</label><input id="atitle" class="input" placeholder="Contoh: My Daily Activities"></div>
<div class="field"><label>Instruksi</label><textarea id="adesc" class="textarea" placeholder="Tulis instruksi untuk siswa..."></textarea></div>
<div class="field"><label>Tenggat</label><input id="adue" class="input" type="date"></div>
<button class="btn gold" onclick="addAssignment()">+ Buat tugas</button></div>
${db.assignments.length?db.assignments.map(a=>{
const subs=db.submissions.filter(s=>s.assignmentId===a.id);
return `<div class="card" style="margin-bottom:10px"><div class="header" style="margin:0"><div><h3>${esc(a.title)}</h3><p class="muted">${esc(a.desc)}</p><div class="meta">${a.due?"Tenggat: "+esc(a.due)+" · ":""}${subs.length} pengumpulan</div></div>
<div class="actions"><button class="btn ghost" onclick="toggleSubs('${a.id}')">Lihat jawaban</button><button class="btn danger" onclick="deleteAssignment('${a.id}')">Hapus</button></div></div><div id="subs-${a.id}"></div></div>`;
}).join(""):`<div class="empty">Belum ada tugas.</div>`}`;
}
function addAssignment(){
const title=atitle.value.trim(),desc=adesc.value.trim(),due=adue.value;
if(!title)return alert("Judul tugas wajib diisi.");
db.assignments.unshift({id:uid(),title,desc,due,createdAt:new Date().toISOString()});save();renderApp();
}
function deleteAssignment(id){if(confirm("Hapus tugas dan semua pengumpulannya?")){db.assignments=db.assignments.filter(x=>x.id!==id);db.submissions=db.submissions.filter(x=>x.assignmentId!==id);save();renderApp()}}
function toggleSubs(id){
const box=document.getElementById("subs-"+id);
const subs=db.submissions.filter(s=>s.assignmentId===id);
box.innerHTML=subs.length?subs.map(s=>`<div class="submission"><div class="header" style="margin:0"><strong>${esc(s.studentName)}</strong><span class="meta">${dateText(s.submittedAt)}</span></div>
<div style="white-space:pre-wrap;margin:8px 0">${esc(s.content)}</div>
<div class="actions"><input id="score-${s.id}" class="input" style="width:90px" type="number" min="0" max="100" placeholder="Nilai" value="${s.score??""}"><input id="feed-${s.id}" class="input" placeholder="Catatan guru" value="${esc(s.feedback||"")}"><button class="btn primary" onclick="grade('${s.id}')">Simpan</button></div>
${s.score!=null?`<div class="meta">Sudah dinilai</div>`:""}</div>`).join(""):`<div class="empty" style="margin-top:12px">Belum ada siswa yang mengumpulkan.</div>`;
}
function grade(id){
const scoreEl=document.getElementById("score-"+id),feedEl=document.getElementById("feed-"+id),raw=scoreEl.value;
if(raw!==""&&(Number(raw)<0||Number(raw)>100))return alert("Nilai harus 0–100.");
const s=db.submissions.find(x=>x.id===id);if(!s)return;
s.score=raw===""?null:Number(raw);s.feedback=feedEl.value.trim();s.gradedAt=new Date().toISOString();save();alert("Nilai tersimpan.");
}

function teacherGrades(){
const rows=db.submissions.map(s=>{const a=db.assignments.find(x=>x.id===s.assignmentId);return {...s,assignmentTitle:a?.title||"Tugas dihapus"}});
return `<div class="header"><div><h2>Rekap Nilai</h2><p class="muted">Lihat semua pengumpulan dan ekspor data.</p></div><button class="btn primary" onclick="exportCSV()">Ekspor Excel/CSV</button></div>
${rows.length?`<div style="overflow:auto"><table style="width:100%;border-collapse:collapse"><thead><tr><th style="text-align:left;padding:10px">Siswa</th><th style="text-align:left;padding:10px">Tugas</th><th style="text-align:left;padding:10px">Nilai</th><th style="text-align:left;padding:10px">Status</th></tr></thead><tbody>${rows.map(r=>`<tr style="border-top:1px solid var(--line)"><td style="padding:10px">${esc(r.studentName)}</td><td style="padding:10px">${esc(r.assignmentTitle)}</td><td style="padding:10px">${r.score??"—"}</td><td style="padding:10px">${r.score!=null?"Dinilai":"Belum dinilai"}</td></tr>`).join("")}</tbody></table></div>`:`<div class="empty">Belum ada pengumpulan.</div>`}`;
}
function exportCSV(){
const rows=[["Nama Siswa","Tugas","Tanggal Kumpul","Nilai","Catatan","Status"],...db.submissions.map(s=>{const a=db.assignments.find(x=>x.id===s.assignmentId);return [s.studentName,a?.title||"Tugas dihapus",dateText(s.submittedAt),s.score??"",s.feedback||"",s.score!=null?"Sudah Dinilai":"Belum Dinilai"]})];
const csv=rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")).join("\\n");
const blob=new Blob(["\\ufeff"+csv],{type:"text/csv;charset=utf-8"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="Nilai_English_"+new Date().toISOString().slice(0,10)+".csv";a.click();URL.revokeObjectURL(a.href);
}

function studentApp(){
let c=roleTab==="materi"?studentMaterials():studentAssignments();
shell(c,[["materi","📚 Materi"],["tugas","📝 Tugas"]]);
}
function studentMaterials(){
return `<div class="header"><div><h2>Materi Bahasa Inggris</h2><p class="muted">Bahan belajar dari guru.</p></div></div>${db.materials.length?db.materials.map(m=>`<div class="card" style="margin-bottom:10px"><h3>${esc(m.title)}</h3>${m.desc?`<p class="muted">${esc(m.desc)}</p>`:""}${m.link?`<a class="link" href="${esc(m.link)}" target="_blank" rel="noopener">Buka materi ↗</a>`:""}<div class="meta">${dateText(m.date)}</div></div>`).join(""):`<div class="empty">Belum ada materi dari guru.</div>`}`;
}
function studentAssignments(){
return `<div class="header"><div><h2>Tugas</h2><p class="muted">Kerjakan dan kumpulkan tugas.</p></div></div>${db.assignments.length?db.assignments.map(a=>{
const my=db.submissions.find(s=>s.assignmentId===a.id&&s.studentName===session.name);
const expired=a.due && new Date(a.due+"T23:59:59")<new Date();
return `<div class="card" style="margin-bottom:12px"><h3>${esc(a.title)}</h3><p class="muted">${esc(a.desc)}</p>${a.due?`<div class="meta">Tenggat: ${esc(a.due)}${expired?" · Tenggat lewat":""}</div>`:""}
<div style="margin-top:12px">${my?`<div class="notice">✓ Sudah dikumpulkan pada ${dateText(my.submittedAt)}</div><div class="submission"><strong>Jawaban</strong><div style="white-space:pre-wrap;margin-top:6px">${esc(my.content)}</div></div>${my.score!=null?`<div style="margin-top:12px" class="score">Nilai: ${my.score}</div>${my.feedback?`<div class="muted">Catatan guru: ${esc(my.feedback)}</div>`:""}`:`<textarea id="ans-${a.id}" class="textarea" placeholder="Tulis jawabanmu di sini..." ${expired?"disabled":""}></textarea><button class="btn sage" style="margin-top:8px" onclick="submitTask('${a.id}')" ${expired?"disabled":""}>Kumpulkan tugas</button>${expired?`<div class="meta" style="color:var(--coral)">Tugas sudah melewati tenggat.</div>`:""}`}</div></div>`;
}).join(""):`<div class="empty">Belum ada tugas dari guru.</div>`}`;
}
function submitTask(id){
const a=db.assignments.find(x=>x.id===id),el=document.getElementById("ans-"+id),answer=el.value.trim();
if(!answer)return alert("Tulis jawaban terlebih dahulu.");
if(a.due&&new Date(a.due+"T23:59:59")<new Date())return alert("Tugas sudah melewati tenggat.");
if(db.submissions.some(s=>s.assignmentId===id&&s.studentName===session.name))return alert("Tugas ini sudah dikumpulkan.");
db.submissions.push({id:uid(),assignmentId:id,studentName:session.name,content:answer,submittedAt:new Date().toISOString(),score:null,feedback:""});save();renderApp();
}
render();
</script>
</body>
</html>
